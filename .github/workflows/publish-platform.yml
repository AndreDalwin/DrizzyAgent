name: publish-platform
run-name: "platform packages ${{ inputs.version }}"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish or repair"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ${{ startsWith(matrix.platform, 'windows-') && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        platform:
          - darwin-arm64
          - darwin-x64
          - darwin-x64-baseline
          - linux-x64
          - linux-x64-baseline
          - linux-arm64
          - linux-x64-musl
          - linux-x64-musl-baseline
          - linux-arm64-musl
          - windows-x64
          - windows-x64-baseline
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Check if package version already exists
        id: check
        run: |
          PKG_NAME="drizzy-agent-${{ matrix.platform }}"
          VERSION="${{ inputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/${PKG_NAME}/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${VERSION} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${VERSION} will be published"
          fi

      - name: Sync release version
        if: steps.check.outputs.skip != 'true'
        run: bun run script/publish.ts --prepare-only
        env:
          VERSION: ${{ inputs.version }}

      - name: Build binary
        if: steps.check.outputs.skip != 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"
          case "$PLATFORM" in
            darwin-arm64) TARGET="bun-darwin-arm64" ;;
            darwin-x64) TARGET="bun-darwin-x64" ;;
            darwin-x64-baseline) TARGET="bun-darwin-x64-baseline" ;;
            linux-x64) TARGET="bun-linux-x64" ;;
            linux-x64-baseline) TARGET="bun-linux-x64-baseline" ;;
            linux-arm64) TARGET="bun-linux-arm64" ;;
            linux-x64-musl) TARGET="bun-linux-x64-musl" ;;
            linux-x64-musl-baseline) TARGET="bun-linux-x64-musl-baseline" ;;
            linux-arm64-musl) TARGET="bun-linux-arm64-musl" ;;
            windows-x64) TARGET="bun-windows-x64" ;;
            windows-x64-baseline) TARGET="bun-windows-x64-baseline" ;;
          esac

          if [[ "$PLATFORM" == windows-* ]]; then
            OUTPUT="packages/${PLATFORM}/bin/drizzy-agent.exe"
          else
            OUTPUT="packages/${PLATFORM}/bin/drizzy-agent"
          fi

          bun build src/cli/index.ts --compile --minify --target="$TARGET" --outfile="$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Publish platform package
        if: steps.check.outputs.skip != 'true'
        run: npm publish --access public --provenance
        working-directory: packages/${{ matrix.platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
