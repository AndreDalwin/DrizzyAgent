name: publish-platform
run-name: "platform packages ${{ inputs.version }}"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish or repair"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ${{ startsWith(matrix.platform, 'windows-') && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        platform:
          - darwin-arm64
          - darwin-x64
          - darwin-x64-baseline
          - linux-x64
          - linux-x64-baseline
          - linux-arm64
          - linux-x64-musl
          - linux-x64-musl-baseline
          - linux-arm64-musl
          - windows-x64
          - windows-x64-baseline
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Check if package version already exists
        id: check
        run: |
          PKG_NAME="drizzy-agent-${{ matrix.platform }}"
          VERSION="${{ inputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/${PKG_NAME}/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${VERSION} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${VERSION} will be published"
          fi

      - name: Sync release version
        if: steps.check.outputs.skip != 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const version = process.env.VERSION
          const platform = process.env.PLATFORM

          const updateVersion = (filePath) => {
            const pkg = JSON.parse(fs.readFileSync(filePath, 'utf8'))
            pkg.version = version
            fs.writeFileSync(filePath, JSON.stringify(pkg, null, 2) + '\n')
          }

          updateVersion(path.join(process.cwd(), 'package.json'))
          updateVersion(path.join(process.cwd(), 'packages', platform, 'package.json'))
          NODE
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}

      - name: Pre-download baseline compile target
        if: steps.check.outputs.skip != 'true' && endsWith(matrix.platform, '-baseline')
        run: |
          BUN_VERSION=$(bun --version)
          PLATFORM="${{ matrix.platform }}"
          PKG_NAME="bun-${PLATFORM}"
          CACHE_DIR=$(bun pm cache)
          CACHE_DEST="${CACHE_DIR}/${PKG_NAME}-v${BUN_VERSION}"

          if [[ -f "$CACHE_DEST" ]]; then
            echo "Compile target already cached at ${CACHE_DEST}"
            exit 0
          fi

          TARBALL_URL="https://registry.npmjs.org/@oven/bun-${PLATFORM}/-/bun-${PLATFORM}-${BUN_VERSION}.tgz"
          echo "Pre-downloading ${PKG_NAME} from ${TARBALL_URL}"

          mkdir -p "$(dirname "$CACHE_DEST")"
          TMP_DIR=$(mktemp -d)
          curl -fsSL --retry 5 --retry-delay 5 "${TARBALL_URL}" | tar -xzf - -C "${TMP_DIR}"

          if [[ "$PLATFORM" == windows-* ]]; then
            BIN_NAME="bun.exe"
          else
            BIN_NAME="bun"
          fi

          if [[ -f "${TMP_DIR}/package/bin/${BIN_NAME}" ]]; then
            cp "${TMP_DIR}/package/bin/${BIN_NAME}" "${CACHE_DEST}"
          elif [[ -f "${TMP_DIR}/package/${BIN_NAME}" ]]; then
            cp "${TMP_DIR}/package/${BIN_NAME}" "${CACHE_DEST}"
          else
            echo "Could not find ${BIN_NAME} in tarball"
            find "${TMP_DIR}" -type f
            exit 1
          fi

          chmod +x "${CACHE_DEST}" 2>/dev/null || true
          ls -lh "${CACHE_DEST}"

      - name: Build binary
        if: steps.check.outputs.skip != 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"
          case "$PLATFORM" in
            darwin-arm64) TARGET="bun-darwin-arm64" ;;
            darwin-x64) TARGET="bun-darwin-x64" ;;
            darwin-x64-baseline) TARGET="bun-darwin-x64-baseline" ;;
            linux-x64) TARGET="bun-linux-x64" ;;
            linux-x64-baseline) TARGET="bun-linux-x64-baseline" ;;
            linux-arm64) TARGET="bun-linux-arm64" ;;
            linux-x64-musl) TARGET="bun-linux-x64-musl" ;;
            linux-x64-musl-baseline) TARGET="bun-linux-x64-musl-baseline" ;;
            linux-arm64-musl) TARGET="bun-linux-arm64-musl" ;;
            windows-x64) TARGET="bun-windows-x64" ;;
            windows-x64-baseline) TARGET="bun-windows-x64-baseline" ;;
          esac

          if [[ "$PLATFORM" == windows-* ]]; then
            OUTPUT="packages/${PLATFORM}/bin/drizzy-agent.exe"
          else
            OUTPUT="packages/${PLATFORM}/bin/drizzy-agent"
          fi

          bun build src/cli/index.ts --compile --minify --target="$TARGET" --outfile="$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Publish platform package
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="${{ inputs.version }}"
          DIST_TAG=""

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
          fi

          if [[ -n "$DIST_TAG" ]]; then
            npm publish --access public --provenance --tag "$DIST_TAG"
          else
            npm publish --access public --provenance
          fi
        working-directory: packages/${{ matrix.platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
