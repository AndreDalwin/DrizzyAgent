name: publish
run-name: "${{ format('release {0}', inputs.version || inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (for example 0.2.0 or 0.2.0-beta.1)"
        required: false
        type: string
      skip_platform:
        description: "Skip platform binary packages"
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Build release artifacts
        run: bun run build

      - name: Run release smoke tests
        run: bun test script/build-binaries.test.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Type check
        run: bun run typecheck

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            PREV=$(curl -s https://registry.npmjs.org/drizzy-agent/latest | jq -r '.version // "0.0.0"')
            BASE="${PREV%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "${{ inputs.bump }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              *) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  publish-platform:
    needs: [test, typecheck, version]
    if: inputs.skip_platform != true
    uses: ./.github/workflows/publish-platform.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish-main:
    runs-on: ubuntu-latest
    needs: [test, typecheck, version, publish-platform]
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.typecheck.result == 'success' &&
      (needs.publish-platform.result == 'success' || needs.publish-platform.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Sync release version
        run: bun run script/publish.ts --prepare-only
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Build main package
        run: bun run clean && bun run build

      - name: Publish main package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          DIST_TAG=""

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
          fi

          if [[ -n "$DIST_TAG" ]]; then
            npm publish --access public --provenance --tag "$DIST_TAG"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  release:
    runs-on: ubuntu-latest
    needs: [version, publish-main]
    if: needs.publish-main.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync release version
        run: bun run script/publish.ts --prepare-only
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Commit release files
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          git add package.json assets/drizzy-agent.schema.json packages/*/package.json
          if ! git diff --cached --quiet; then
            git commit -m "release: v${VERSION}"
          else
            echo "No release file changes to commit"
          fi

      - name: Create and push git tag
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
          fi
          git push origin HEAD
          git push origin "v${VERSION}"

      - name: Generate changelog
        run: bun run script/generate-changelog.ts > /tmp/changelog.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create GitHub release
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          gh release view "v${VERSION}" >/dev/null 2>&1 || \
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/changelog.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
